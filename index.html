<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BossDesk | Executive Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Sign in / create account -->
  <div id="auth" class="auth" hidden></div>

  <!-- App -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo serif">BD</div>
        <div><b class="serif">BossDesk</b><small>EXECUTIVE CONSOLE</small></div>
      </div>
      <nav id="nav"></nav>
      <div class="who" id="who"></div>
    </aside>
    <div class="backdrop" data-act="closeNav"></div>

    <div class="main">
      <header class="topbar">
        <button type="button" class="ib menu-btn" data-act="openNav" id="menuBtn" aria-label="Open menu"></button>
        <div class="titles">
          <h1 class="serif" id="pageTitle"></h1>
          <p id="pageSub"></p>
        </div>
        <span class="rec-pill" id="recPill" hidden>● Recording</span>
        <div class="top-actions">
          <button type="button" class="ib" data-act="theme" id="themeBtn" aria-label="Switch theme"></button>
          <button type="button" class="ib" data-act="logout" id="logoutBtn" aria-label="Log out"></button>
        </div>
      </header>
      <main class="page" id="page"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts"></div>
  <div id="printDoc" class="doc"></div>

  <script src="script.js"></script>
</body>
</html>
